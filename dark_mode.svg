<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="922" height="550" viewBox="0 0 922 550" font-family="'Menlo', 'Consolas', 'DejaVu Sans Mono', monospace" font-size="14px">
	<style>
	.line { animation: type var(--t) steps(var(--n), end) var(--d) backwards; }
	@keyframes type {
		from { clip-path: inset(-2px 100% -2px 0); }
		to   { clip-path: inset(-2px 0 -2px 0); }
	}
	.bars { animation: rise var(--t) linear var(--d) backwards; }
	@keyframes rise {
		from { clip-path: inset(100% -2px -2px -2px); }
		to   { clip-path: inset(-2px -2px -2px -2px); }
	}
	.art { animation: scan 1.5s steps(35, end) 0s backwards; }
	@keyframes scan {
		from { clip-path: inset(0 0 100% 0); }
		to   { clip-path: inset(0 0 0 0); }
	}
	.cursor { animation: curhide 5.782s steps(1), blink 1.2s steps(1) 5.782s infinite; }
	@keyframes curhide { from, to { opacity: 0; } }
	@keyframes blink { 50% { opacity: 0; } }
	@media (prefers-reduced-motion: reduce) {
		.line, .bars, .art, .cursor { animation: none; }
	}
	</style>
